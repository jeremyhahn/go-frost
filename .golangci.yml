# golangci-lint configuration for go-frost
# Following Google Go style guide and best practices

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - goimports
    - goconst
    - misspell
    - unparam
    - unconvert
    - nolintlint
    - revive
    - gosec
    - bodyclose
    - noctx
    - whitespace
  disable:
    - stylecheck  # Package names use underscores to match RFC naming conventions
    - prealloc  # Pre-allocation suggestions can be noisy
    - gofmt  # Use go fmt instead (version mismatch with golangci-lint bundled gofmt)

linters-settings:
  errcheck:
    check-type-assertions: false  # Type assertions are intentional in group implementations
    check-blank: false  # Allow blank assignments for intentionally ignored errors

  govet:
    enable-all: true
    disable:
      - fieldalignment  # Struct field ordering optimization is not critical
      - shadow  # Variable shadowing is intentional in many test and error handling patterns

  staticcheck:
    checks:
      - "all"
      - "-SA1019"  # Ignore deprecated API warnings (ristretto255 API migration pending)

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/jeremyhahn/go-frost

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "disableStutteringCheck"

  gosec:
    excludes:
      - G101  # Look for hard coded credentials (false positives on test vectors)
      - G104  # Errors unhandled (many intentional blank assignments for infallible operations)
      - G115  # Integer overflow conversion (intentional uint conversions for RFC compliance)
      - G304  # Potential file inclusion via variable (CLI intentionally reads user-specified files)
      - G306  # Expect WriteFile permissions to be 0600 (CLI writes non-sensitive signature files)
      - G404  # Use of weak random number generator (we use crypto/rand)
    config:
      global:
        audit: enabled

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - vendor
    - test/integration/data

  exclude-rules:
    # Exclude some linters from running on test files
    - path: _test\.go
      linters:
        - gosec
        - unparam
        - errcheck
        - goconst
        - ineffassign
        - revive

    # Exclude test vectors and RFC compliance tests
    - path: test/
      linters:
        - gosec
        - errcheck
        - goconst
        - ineffassign
        - revive

    # Allow unsafe in CGO bindings
    - path: cmd/libfrost/
      linters:
        - gosec
      text: "G103"

    # Testutil mocks don't need strict error checking or exported comments
    - path: pkg/frost/helpers/testutil/
      linters:
        - errcheck
        - revive
        - goconst

    # Storage cleanup errors can be ignored
    - path: pkg/storage/
      text: "Error return value of `os.Remove` is not checked"

    # Group implementations have intentional error handling patterns
    - path: pkg/frost/group/
      linters:
        - errcheck
        - ineffassign

    # Ciphersuite hash reads are always valid
    - path: pkg/frost/ciphersuite/
      linters:
        - errcheck
        - ineffassign

    # VSS and keygen have intentional patterns
    - path: pkg/frost/keygen/
      linters:
        - errcheck
        - revive  # test_helpers.go has mock types without exported comments

    # Helpers polynomial has intentional patterns
    - path: pkg/frost/helpers/polynomial.go
      linters:
        - errcheck

    # Signing coordinator has intentional patterns
    - path: pkg/frost/signing/
      linters:
        - errcheck
        - ineffassign

    # Security has intentional patterns
    - path: pkg/frost/security/
      linters:
        - errcheck
        - goconst
        - ineffassign

    # CLI parsing errors can be intentional
    - path: cmd/frost/
      linters:
        - errcheck

    # Signer has intentional patterns
    - path: pkg/signer/
      linters:
        - errcheck

    # Service tests
    - path: pkg/frost/service/
      linters:
        - errcheck
        - staticcheck

    # Staticcheck SA4010 false positives in tests
    - text: "SA4010"
      linters:
        - staticcheck

    # Staticcheck SA4006 (unused value) in tests
    - text: "SA4006"
      linters:
        - staticcheck

    # gosimple S1009 nil check patterns
    - text: "S1009"
      linters:
        - gosimple

    # revive exported comment issues in CLI export types
    - path: cmd/frost/main.go
      linters:
        - revive

    # revive exported comment issues in security errors
    - path: pkg/frost/security/errors.go
      linters:
        - revive

    # revive exported comment issues in keystore errors
    - path: pkg/frost/keystore/errors.go
      linters:
        - revive

    # Unused functions in p256 constant-time scalar (may be needed later)
    - path: pkg/frost/group/p256/scalar_ct.go
      linters:
        - unused

    # Unused fields/functions in storage (cleanup scheduled, etc.)
    - path: pkg/storage/
      linters:
        - unused

    # Unused fields in session manager (will be used in future features)
    - path: pkg/frost/service/session_manager.go
      linters:
        - unused
