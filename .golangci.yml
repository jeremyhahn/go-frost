# golangci-lint configuration for go-frost
# Following Google Go style guide and best practices

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goconst
    - misspell
    - unparam
    - unconvert
    - nolintlint
    - revive
    - gosec
    - bodyclose
    - noctx
    - whitespace
  disable:
    - prealloc

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    staticcheck:
      checks:
        - "all"
        - "-SA1019"  # Ignore deprecated API warnings (p256 curve API migration pending)
        - "-ST1003"  # Underscore package names follow RFC 9591 ciphersuite naming conventions

    gosec:
      excludes:
        - G103  # Unsafe usage is audited (secmem ZeroString)
        - G115  # Integer overflow conversions are intentional byte extraction in crypto code

    goconst:
      min-len: 3
      min-occurrences: 3

    misspell:
      locale: US

    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Exclude linters from test files and test directory
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - errcheck
          - goconst
          - ineffassign
          - revive
          - staticcheck
      - path: ^test/
        linters:
          - gosec
          - unparam
          - errcheck
          - goconst
          - ineffassign
          - revive
          - staticcheck
      # Exclude test utilities from strict linting
      - path: testutil/
        linters:
          - gosec
          - unparam
          - errcheck
          - goconst
          - ineffassign
          - revive
          - staticcheck
      # Exclude var-naming rule for cryptographic package names (RFC 9591 naming conventions)
      - path: pkg/frost/ciphersuite/(ed25519_sha512|ed448_shake256|p256_sha256|ristretto255_sha512|secp256k1_sha256)/
        linters:
          - revive
        text: "var-naming: don't use an underscore in package name"
      # Exclude stuttering check for intentional API design choices
      - linters:
          - revive
        text: "type name will be used as.*stutters"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jeremyhahn/go-frost

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
