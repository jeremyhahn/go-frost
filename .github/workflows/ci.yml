name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Tidy dependencies
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum not tidy" && exit 1)

    - name: Run go vet
      run: go vet ./...

    - name: Install and run golangci-lint
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        golangci-lint run --timeout=5m

    - name: Install and run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Verify module integrity
      run: go mod verify

    - name: Install and run gosec
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -quiet -exclude=G101,G104,G115,G304,G306,G404 ./...

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Two paths for one gate (devops.md §8). trivy-action's setup step cannot
    # authenticate to github.com from a Gitea runner and upload-sarif has no
    # GHES-compatible endpoint there, so the action-based path is guarded on
    # the server URL and Gitea gates with the trivy CLI below. Both run the
    # same fs scan with the same severity threshold; only the SARIF upload to
    # code scanning is GitHub-only.
    - name: Trivy scan (SARIF for code scanning)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        format: sarif
        output: trivy-results.sarif
        exit-code: 0
        skip-dirs: test
        trivyignores: .trivyignore

    - name: Upload Trivy SARIF
      if: github.server_url == 'https://github.com'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
        category: trivy-fs

    - name: Trivy gate (fail on CRITICAL/HIGH)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        exit-code: 1
        format: table
        skip-dirs: test
        trivyignores: .trivyignore

    - name: Install Trivy CLI (Gitea)
      if: github.server_url != 'https://github.com'
      run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

    - name: Trivy gate (Gitea)
      if: github.server_url != 'https://github.com'
      run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs test .

  trivy-image:
    name: Trivy Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # The repository ships a container image; devops.md §8 requires every image
    # it builds to be scanned before it can reach a registry.
    - name: Build image
      run: docker build -t go-frost:ci .

    - name: Install Trivy CLI
      if: github.server_url != 'https://github.com'
      run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

    - name: Trivy image gate (Gitea)
      if: github.server_url != 'https://github.com'
      run: trivy image --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 go-frost:ci

    - name: Trivy image gate (fail on CRITICAL/HIGH)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: image
        image-ref: go-frost:ci
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        exit-code: 1
        format: table
        trivyignores: .trivyignore

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: go test -v -race -timeout 5m ./pkg/...

    - name: Generate coverage report
      run: |
        go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./pkg/... | \
          xargs go test -coverprofile=coverage.out -covermode=atomic

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Build CLI binary
      run: go build -o frost ./cmd/frost

    - name: Build shared library
      run: CGO_ENABLED=1 go build -buildmode=c-shared -o dist/libfrost.so ./cmd/libfrost

    - name: Build static library
      run: CGO_ENABLED=1 go build -buildmode=c-archive -o dist/libfrost.a ./cmd/libfrost

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: build-artifacts
        path: |
          frost
          dist/
