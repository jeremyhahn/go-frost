# ci-template: v1.15 (customized)
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.

name: CI

on:
  push:
    # main is the only trunk. automerge.yml's merge trains are PRs from
    # merge-train/* and get CI from pull_request (ci-template v1.15).
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run by hand without an empty commit. Jobs here occasionally fail on
  # transient infrastructure rather than on the tree — the Trivy installer
  # resolves its version through the unauthenticated GitHub API, which is
  # rate-limited when the whole portfolio builds at once — and this Gitea
  # build exposes no rerun API (devops.md §5).
  workflow_dispatch:

# Supersession control (#21). A newer head on the same ref cancels the older
# CI run instead of both occupying the shared runner's capacity. Portfolio-wide,
# 73% of runs were superseded but still running, and queue latency (median 46
# min, p90 94 min) was the single biggest constraint on landing work.
#
# MEASURED on Gitea 1.27.1 (2026-09-06). This corrected the v1.9 `needs:`
# comments (removed in v1.15 with the staging itself), which asserted
# cancellation was impossible here:
#   - Workflow level, keyed on the REF, `cancel-in-progress: true` -> Gitea
#     cancels the OLDER run and the NEWEST completes. Observed live on
#     go-netmon (run 12242 cancelled, 12269 survived) and go-recountly
#     (12261 flipped queued -> cancelled).
#   - This repo's own commit 6e48db0 ("ci: drop concurrency from task-worker")
#     is NOT evidence against it. That block was JOB level, keyed
#     `task-worker-${{ github.repository }}` with NO ref component -- so every
#     task worker in the repo shared ONE group -- and `cancel-in-progress:
#     false`. Gitea cannot QUEUE, so the false path cancels: those workers were
#     saturated by their siblings, not cancelled from an unoccupied group. It
#     says nothing about a ref-keyed `cancel-in-progress: true`.
#   - Task #90 still holds and is WHY this is the only available mechanism:
#     1.27.1 publishes no `cancel` REST route at any path, so nothing can shed
#     a superseded run from OUTSIDE. `concurrency:` sheds it from inside.
#   - `cancel-in-progress` does NOT evaluate expressions on 1.27.1 -- any
#     non-empty value is truthy, so a `${{ }}` rendering "false" would still
#     cancel. Write the literal. (Group-key expressions DO evaluate.)
#   - The group is per-REF, so a PR's runs and main's push runs never cancel
#     each other and two PRs never cancel each other; a cancelled run only ever
#     writes `failure` to a SUPERSEDED sha, which branch protection has already
#     moved off. The key leads with `github.workflow`, so this `CI` group
#     structurally cannot reach the separate `Code Review` workflow that is the
#     other required check.
#   - release.yml deliberately does NOT get this: cancelling a release
#     mid-publish is destructive. Nor do the review workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

# Pinned once for both Trivy install steps below, so the two cannot drift
# apart. Bump deliberately; `curl -sI
# https://github.com/aquasecurity/trivy/releases/latest` shows the current tag
# without an API call.
env:
  TRIVY_VERSION: '0.74.0'

# Every job starts at once (ci-template v1.14/v1.15): none waits on another,
# and CI Gate, the one required check, needs them all and fails closed. Do not
# reintroduce `needs:` ordering between jobs; each one builds what it uses.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Tidy dependencies
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum not tidy" && exit 1)

    - name: Run go vet
      run: go vet ./...

    # Baked, not installed (issue #19). The ci-runner image bakes golangci-lint
    # and records it in /etc/ci-runner-tools.txt; a `go install` here would
    # overwrite that copy at run time with whatever this file names, which is
    # how a v2.12.2 pin (cannot lint Go 1.27) undid the image's baked version.
    #
    # PINNED (devops.md §9, "a pin that is specifically documented, in place,
    # with the reason"): the pin moves in the same change as `go 1.27.0` —
    # v2.12.2 cannot lint Go 1.27, and v2.13.0 panicked on Go 1.26 ("nilness:
    # internal error: unhandled builtin recover"). Raise it together with the
    # image and the go directive.
    #
    # Fail closed, never fall back to a network install: a missing tool or a
    # version mismatch means the image is wrong, and installing over it would
    # hide exactly that.
    #
    # The guard lives in .github/scripts/verify-baked-tool.sh (shared with the
    # Security Scan job) and is regression-tested with stub tools by the step
    # below, before any baked tool is trusted.
    - name: Test baked-tool guard
      run: bash .github/scripts/verify-baked-tool_test.sh

    # make release-alpha (issue #17) publishes immutable tags, so its guards
    # are regression-tested on every change against a temporary remote.
    - name: Test release-alpha recipe
      run: make test-release-alpha

    - name: Verify baked golangci-lint
      env:
        GOLANGCI_LINT_VERSION: 'v2.14.0'
      run: bash .github/scripts/verify-baked-tool.sh golangci-lint github.com/golangci/golangci-lint/v2 "$GOLANGCI_LINT_VERSION"

    - name: Run golangci-lint (baked)
      run: golangci-lint run --timeout=5m

    - name: Install and run staticcheck
      run: |
        command -v staticcheck >/dev/null 2>&1 || go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Verify module integrity
      run: go mod verify

    # Baked, not installed (issue #19) — same rule as golangci-lint in the
    # Lint job. An `@latest` install here was a network dependency that could
    # fail and skip the analysers (a red check with no verdict on the code),
    # and it scanned the same commit with different analyser versions on
    # different days.
    #
    # PINNED (devops.md §9, documented in place): the versions the ci-runner
    # image bakes and records in /etc/ci-runner-tools.txt. Raise them together
    # with the image. The version is read from the binary's embedded build
    # info (`go version -m`), not from `gosec --version`: a `go install`ed
    # gosec prints "dev" whatever version was built, so its own output cannot
    # prove which version ran.
    #
    # Fail closed, never fall back to a network install.
    - name: Verify baked security scanners
      env:
        GOSEC_VERSION: 'v2.29.0'
        GOVULNCHECK_VERSION: 'v1.8.0'
      run: |
        bash .github/scripts/verify-baked-tool.sh gosec github.com/securego/gosec/v2 "$GOSEC_VERSION"
        bash .github/scripts/verify-baked-tool.sh govulncheck golang.org/x/vuln "$GOVULNCHECK_VERSION"

    - name: Run gosec (baked)
      run: gosec -concurrency 4 -quiet -exclude=G101,G104,G115,G304,G306,G404 ./...

    - name: Run govulncheck (baked)
      run: govulncheck ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Two paths for one gate (devops.md §8). trivy-action's setup step cannot
    # authenticate to github.com from a Gitea runner and upload-sarif has no
    # GHES-compatible endpoint there, so the action-based path is guarded on
    # the server URL and Gitea gates with the trivy CLI below. Both run the
    # same fs scan with the same severity threshold; only the SARIF upload to
    # code scanning is GitHub-only.
    - name: Trivy scan (SARIF for code scanning)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        format: sarif
        output: trivy-results.sarif
        exit-code: 0
        skip-dirs: test
        trivyignores: .trivyignore

    - name: Upload Trivy SARIF
      if: github.server_url == 'https://github.com'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
        category: trivy-fs

    - name: Trivy gate (fail on CRITICAL/HIGH)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        exit-code: 1
        format: table
        skip-dirs: test
        trivyignores: .trivyignore

    # contrib/install.sh resolves its version through the unauthenticated
    # GitHub API, which rate-limits when the whole portfolio builds at once --
    # the transient this workflow's header already documents. It timed out on a
    # release run (curl exit 28) and took the job with it. Fetching the pinned
    # release asset avoids the API entirely; the checksum is verified because an
    # unverified binary fetched over the network is then handed the whole source
    # tree to scan. Same shape as go-xkms#43.
    - name: Install Trivy CLI (Gitea)
      if: github.server_url != 'https://github.com'
      run: |
        set -euo pipefail
        base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
        tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        tmp="$(mktemp -d)"
        curl -sfL --retry 3 --retry-delay 5 -o "$tmp/$tarball" "$base/$tarball"
        curl -sfL --retry 3 --retry-delay 5 -o "$tmp/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
        (cd "$tmp" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
        tar -xzf "$tmp/$tarball" -C "$tmp" trivy
        install -m 0755 "$tmp/trivy" /usr/local/bin/trivy
        rm -rf "$tmp"
        trivy --version

    - name: Trivy gate (Gitea)
      if: github.server_url != 'https://github.com'
      run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs test .

  trivy-image:
    name: Trivy Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # The repository ships a container image; devops.md §8 requires every image
    # it builds to be scanned before it can reach a registry.
    - name: Build image
      run: docker build -t go-frost:ci .

    # Pinned release asset rather than contrib/install.sh, for the reason given
    # on the Trivy job above.
    - name: Install Trivy CLI
      if: github.server_url != 'https://github.com'
      run: |
        set -euo pipefail
        base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
        tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        tmp="$(mktemp -d)"
        curl -sfL --retry 3 --retry-delay 5 -o "$tmp/$tarball" "$base/$tarball"
        curl -sfL --retry 3 --retry-delay 5 -o "$tmp/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
        (cd "$tmp" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
        tar -xzf "$tmp/$tarball" -C "$tmp" trivy
        install -m 0755 "$tmp/trivy" /usr/local/bin/trivy
        rm -rf "$tmp"
        trivy --version

    - name: Trivy image gate (Gitea)
      if: github.server_url != 'https://github.com'
      run: trivy image --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 go-frost:ci

    - name: Trivy image gate (fail on CRITICAL/HIGH)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: image
        image-ref: go-frost:ci
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        exit-code: 1
        format: table
        trivyignores: .trivyignore

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Download dependencies
      run: go mod download

    # ./cmd/... joined ./pkg/... on 2026-08-21: the CLI and the C shim carry
    # security-relevant selection logic (fail-closed ciphersuite resolution,
    # the FIPS policy result a C caller sees) and had no test ever run by any
    # workflow. The dark suites under test/ stay excluded -- test/rfc's timing
    # tests flake on shared runners (company task #49) and test/transport is
    # the build-tagged integration job below.
    - name: Run unit tests
      run: go test -v -race -timeout 5m ./pkg/... ./cmd/...

    - name: Generate coverage report
      run: |
        go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./pkg/... ./cmd/... | \
          xargs go test -coverprofile=coverage.out -covermode=atomic

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    # The build-tagged suite under test/ — a real distributed FROST exchange
    # over HTTP between in-process participant nodes. It had never been run by
    # any workflow before 2026-08-14. make integration-test is the same target
    # a developer runs (devops.md §4); the nodes bind port 0, so this is safe
    # to run concurrently with other jobs even though job containers share the
    # host network namespace.
    - name: Run integration suite
      run: make integration-test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Build CLI binary
      run: go build -o frost ./cmd/frost

    - name: Build shared library
      run: CGO_ENABLED=1 go build -buildmode=c-shared -o dist/libfrost.so ./cmd/libfrost

    - name: Build static library
      run: CGO_ENABLED=1 go build -buildmode=c-archive -o dist/libfrost.a ./cmd/libfrost

    # upload-artifact v4+ refuses to run against any server that is not
    # github.com -- it detects one and reports "not currently supported on
    # GHES", and Gitea presents as such (devops.md §1). The build has already
    # happened by this point; only the artifact upload is skipped.
    - name: Upload artifacts
      if: github.server_url == 'https://github.com'
      uses: actions/upload-artifact@v6
      with:
        name: build-artifacts
        path: |
          frost
          dist/

  fips:
    name: FIPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build all packages (FIPS mode)
        run: go build ./...

      # Mirrors the Unit Tests job's invocation exactly -- same package scope
      # (./pkg/... ./cmd/...), same build tags (none), same exclusions -- so
      # the FIPS env above is the only thing that differs between the two jobs
      # (issue #7). Keep the two invocations identical when either moves.
      #
      # The previous ./... scope was the one place in any workflow that ran
      # test/rfc, whose RFC 9591 section 7 side-channel tests call a leak at an
      # 8ns delta and report it as noise on a CPU-capped shared runner. That
      # suite is deliberately dark (company task #49) and wiring it in is a
      # separate decision, so this job stops doing it as a side effect.
      #
      # FROST(P-256, SHA-256) -- the only suite this library will hand out under
      # FIPS enforcement (not an approval; FROST is not an approved scheme, see
      # issue #14) -- is covered by pkg/frost/ciphersuite/suites, which runs the
      # RFC 9591 Appendix E.4 known-answer check and a keygen/sign/verify through
      # the selection API, and asserts that the non-selectable suites are
      # refused with a typed error under fips140=only (issue #12). cmd/frost
      # and cmd/libfrost assert the same refusal at their own boundaries.
      - name: Unit tests (FIPS mode)
        run: go test -v -race -timeout 5m ./pkg/... ./cmd/...

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, security, trivy, trivy-image, test, integration, build, fips]

    steps:
    - name: Fail closed on any non-success
      run: |
        check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
        BAD=0
        check lint        "${{ needs.lint.result }}"
        check security    "${{ needs.security.result }}"
        check trivy       "${{ needs.trivy.result }}"
        check trivy-image "${{ needs.trivy-image.result }}"
        check test        "${{ needs.test.result }}"
        check integration "${{ needs.integration.result }}"
        check build       "${{ needs.build.result }}"
        check fips        "${{ needs.fips.result }}"
        exit $BAD
