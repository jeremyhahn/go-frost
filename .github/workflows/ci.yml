name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Tidy dependencies
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum not tidy" && exit 1)

    - name: Run go vet
      run: go vet ./...

    - name: Install and run golangci-lint
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        golangci-lint run --timeout=5m

    - name: Install and run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Install and run gosec
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -quiet -exclude=G101,G104,G115,G304,G306,G404 ./...

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: go test -v -race -timeout 5m ./pkg/...

    - name: Generate coverage report
      run: |
        go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./pkg/... | \
          xargs go test -coverprofile=coverage.out -covermode=atomic

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Build CLI binary
      run: go build -o frost ./cmd/frost

    - name: Build shared library
      run: CGO_ENABLED=1 go build -buildmode=c-shared -o dist/libfrost.so ./cmd/libfrost

    - name: Build static library
      run: CGO_ENABLED=1 go build -buildmode=c-archive -o dist/libfrost.a ./cmd/libfrost

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: |
          frost
          dist/
