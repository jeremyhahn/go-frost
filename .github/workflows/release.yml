name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write


jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.5'
        cache: true

    - name: Run tests
      run: make test

    - name: Run security scan
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -quiet -exclude=G101,G104,G115,G304,G306,G404 ./...

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.5'
        cache: true

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build binaries for all platforms
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        CGO_ENABLED: 0
      run: |
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        GIT_COMMIT=$(git rev-parse --short HEAD)
        LDFLAGS="-s -w -X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT} -X main.BuildDate=${BUILD_DATE}"

        mkdir -p dist

        platforms=(
          "linux/amd64"
          "linux/arm64"
          "darwin/amd64"
          "darwin/arm64"
          "windows/amd64"
          "windows/arm64"
        )

        # Build standard binaries
        for platform in "${platforms[@]}"; do
          GOOS="${platform%/*}"
          GOARCH="${platform#*/}"
          output_name="frost-${VERSION}-${GOOS}-${GOARCH}"

          if [ "$GOOS" = "windows" ]; then
            output_name+=".exe"
          fi

          echo "Building for $GOOS/$GOARCH..."
          GOOS=$GOOS GOARCH=$GOARCH go build \
            -ldflags="${LDFLAGS}" \
            -o "dist/${output_name}" \
            ./cmd/frost
        done

        # Build FIPS binaries (Linux only - FIPS mode requires specific OS support)
        fips_platforms=(
          "linux/amd64"
          "linux/arm64"
        )

        for platform in "${fips_platforms[@]}"; do
          GOOS="${platform%/*}"
          GOARCH="${platform#*/}"
          output_name="frost-fips-${VERSION}-${GOOS}-${GOARCH}"

          echo "Building FIPS binary for $GOOS/$GOARCH..."
          GOFIPS140=latest GOOS=$GOOS GOARCH=$GOARCH go build \
            -ldflags="${LDFLAGS}" \
            -o "dist/${output_name}" \
            ./cmd/frost
        done

    - name: Upload binary artifacts
      uses: actions/upload-artifact@v7
      with:
        name: binaries
        path: dist/frost-*

  build-libraries:
    name: Build Libraries
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.5'
        cache: true

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build standard libraries
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        make build-lib
        # Rename with version
        mv dist/libfrost.so dist/libfrost-${VERSION}-linux-amd64.so
        mv dist/libfrost.a dist/libfrost-${VERSION}-linux-amd64.a
        mv dist/libfrost.h dist/libfrost-${VERSION}.h

    - name: Build FIPS libraries
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        make build-lib-fips
        # Rename with version
        mv dist/fips/libfrost-fips.so dist/libfrost-fips-${VERSION}-linux-amd64.so
        mv dist/fips/libfrost-fips.a dist/libfrost-fips-${VERSION}-linux-amd64.a
        mv dist/fips/libfrost-fips.h dist/libfrost-fips-${VERSION}.h

    - name: Upload library artifacts
      uses: actions/upload-artifact@v7
      with:
        name: libraries
        path: |
          dist/libfrost-*.so
          dist/libfrost-*.a
          dist/libfrost-*.h

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-libraries]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.5'
        cache: true

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Download binary artifacts
      uses: actions/download-artifact@v8
      with:
        name: binaries
        path: dist/

    - name: Download library artifacts
      uses: actions/download-artifact@v8
      with:
        name: libraries
        path: dist/

    - name: Generate checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/frost
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: production
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
        body: |
          ## FROST Threshold Signature Scheme v${{ steps.get_version.outputs.VERSION }}

          RFC 9591 Implementation - Production Ready

          ### Changes
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ### Downloads

          #### CLI Binaries
          | Platform | Standard | FIPS 140 |
          |----------|----------|----------|
          | Linux (AMD64) | `frost-${{ steps.get_version.outputs.VERSION }}-linux-amd64` | `frost-fips-${{ steps.get_version.outputs.VERSION }}-linux-amd64` |
          | Linux (ARM64) | `frost-${{ steps.get_version.outputs.VERSION }}-linux-arm64` | `frost-fips-${{ steps.get_version.outputs.VERSION }}-linux-arm64` |
          | macOS (Intel) | `frost-${{ steps.get_version.outputs.VERSION }}-darwin-amd64` | - |
          | macOS (Apple Silicon) | `frost-${{ steps.get_version.outputs.VERSION }}-darwin-arm64` | - |
          | Windows (AMD64) | `frost-${{ steps.get_version.outputs.VERSION }}-windows-amd64.exe` | - |
          | Windows (ARM64) | `frost-${{ steps.get_version.outputs.VERSION }}-windows-arm64.exe` | - |

          #### Libraries (Linux AMD64)
          | Type | Standard | FIPS 140 |
          |------|----------|----------|
          | Shared (.so) | `libfrost-${{ steps.get_version.outputs.VERSION }}-linux-amd64.so` | `libfrost-fips-${{ steps.get_version.outputs.VERSION }}-linux-amd64.so` |
          | Static (.a) | `libfrost-${{ steps.get_version.outputs.VERSION }}-linux-amd64.a` | `libfrost-fips-${{ steps.get_version.outputs.VERSION }}-linux-amd64.a` |
          | Header | `libfrost-${{ steps.get_version.outputs.VERSION }}.h` | `libfrost-fips-${{ steps.get_version.outputs.VERSION }}.h` |

          #### Docker
          ```bash
          docker pull ghcr.io/${{ github.repository_owner }}/frost:${{ steps.get_version.outputs.VERSION }}
          docker run ghcr.io/${{ github.repository_owner }}/frost:${{ steps.get_version.outputs.VERSION }} version
          ```

          ### Using the Library

          **C/C++ Integration:**
          ```c
          #include "libfrost.h"

          // Generate 2-of-3 threshold keys
          char *keys;
          size_t keys_len;
          uint8_t *pubkey;
          size_t pubkey_len;

          frost_error_t err = frost_generate_keys(
              FROST_CIPHERSUITE_RISTRETTO255_SHA512,
              2, 3,
              &keys, &keys_len,
              &pubkey, &pubkey_len
          );
          ```

          **Link with:**
          ```bash
          # Shared library
          gcc -o myapp myapp.c -L. -lfrost -Wl,-rpath,.

          # Static library
          gcc -o myapp myapp.c libfrost.a -lpthread -lm
          ```

          ### Checksums
          Verify your download with SHA256 checksums in `checksums.txt`.

          ### Security
          - All ciphersuites are constant-time compliant
          - FIPS 140 builds use Go 1.24+ GOFIPS140=latest mode
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
