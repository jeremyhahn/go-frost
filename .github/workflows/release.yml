name: Release

# workflow_dispatch takes a tag so a Release can be published for an existing, immutable tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish a Release for (e.g. v0.3.0-alpha)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # Nothing publishes until the tag, VERSION and CHANGELOG agree; the tag's v prefix is stripped for the comparison.
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the tag being released
        id: resolve
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "releasing ${TAG}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Tag matches VERSION and CHANGELOG
        run: |
          TAG="${{ steps.resolve.outputs.version }}"
          FILE="$(tr -d '[:space:]' < VERSION)"

          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag v${TAG} does not match VERSION file (${FILE})."
            echo "Bump VERSION in the release commit before tagging."
            exit 1
          fi

          if ! grep -qF "## [${TAG}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG}]' heading."
            echo "Every released tag gets its own section; do not tag from [Unreleased]."
            exit 1
          fi

          echo "tag v${TAG} matches VERSION and has a CHANGELOG section"

  # Binaries and libraries build in one job so nothing crosses a job boundary.
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [validate]
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      # Check out the workflow's own ref beside the tag's tree, so tags older than .github/scripts/ can still be released.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-tooling

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: make test

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT} -X main.BuildDate=${BUILD_DATE}"
          mkdir -p dist

          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            name="frost-${VERSION}-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && name="${name}.exe"
            echo "building ${name}"
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="${LDFLAGS}" -o "dist/${name}" ./cmd/frost
          done

          # FIPS binaries are Linux-only: GOFIPS140 selects the certified module
          # and the release only claims the platforms it is built and run on.
          for platform in linux/amd64 linux/arm64; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            name="frost-fips-${VERSION}-${GOOS}-${GOARCH}"
            echo "building ${name}"
            GOFIPS140=latest GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="${LDFLAGS}" -o "dist/${name}" ./cmd/frost
          done

      # cgo, so linux/amd64 only -- cross-compiling a c-shared object needs a
      # cross toolchain this job does not install.
      - name: Build libraries
        run: |
          make build-lib
          mv dist/libfrost.so dist/libfrost-${VERSION}-linux-amd64.so
          mv dist/libfrost.a  dist/libfrost-${VERSION}-linux-amd64.a
          mv dist/libfrost.h  dist/libfrost-${VERSION}.h

          make build-lib-fips
          mv dist/fips/libfrost-fips.so dist/libfrost-fips-${VERSION}-linux-amd64.so
          mv dist/fips/libfrost-fips.a  dist/libfrost-fips-${VERSION}-linux-amd64.a
          mv dist/fips/libfrost-fips.h  dist/libfrost-fips-${VERSION}.h
          rmdir dist/fips 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        if: github.server_url == 'https://github.com'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true

      # The forge's /api/v1 releases endpoint is GitHub-shaped, so curl is enough.
      - name: Create Gitea Release
        if: github.server_url != 'https://github.com'
        env:
          GITEA_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: bash .release-tooling/.github/scripts/gitea-release.sh

  # Separate job, and deliberately NOT a dependency of the release: an image
  # that cannot be published must not cost the release its binaries.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: [validate]
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # ghcr.io on GitHub, the forge's own registry elsewhere; derived, never hardcoded.
      - name: Resolve registry
        id: registry
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            echo "host=ghcr.io" >> $GITHUB_OUTPUT
          else
            echo "host=$(echo '${{ github.server_url }}' | sed -E 's#^https?://##')" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.host }}/${{ github.repository_owner }}/frost
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ !contains(env.TAG, '-') }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ !contains(env.TAG, '-') }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}

      # Gate the image on CRITICAL/HIGH before publishing: build amd64 locally, scan, then push the multi-arch manifest.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: false
          load: true
          tags: go-frost:scan
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha

      # Fetch the pinned trivy release asset and verify its checksum instead of the rate-limited install script; bump TRIVY_VERSION deliberately.
      - name: Install trivy CLI
        env:
          TRIVY_VERSION: '0.74.0'
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tmp="$(mktemp -d)"
          curl -sfL --retry 3 --retry-delay 5 -o "$tmp/$tarball" "$base/$tarball"
          curl -sfL --retry 3 --retry-delay 5 -o "$tmp/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$tmp" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$tarball" -C "$tmp" trivy
          install -m 0755 "$tmp/trivy" /usr/local/bin/trivy
          rm -rf "$tmp"
          trivy --version

      # --ignore-unfixed on the OS layer: the gate means a rebuild fixes it.
      - name: Trivy image gate (fail on CRITICAL/HIGH)
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 go-frost:scan

      # Only publication tolerates failure: the Actions token lacks write:package for the private registry, which is also plain HTTP.
      - name: Log in to the container registry
        id: login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ github.server_url == 'https://github.com' && secrets.GITHUB_TOKEN || secrets.AGENT_TOKEN }}

      - name: Build and push
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tolerated failure is silent in the run summary, and a release that
      # quietly ships no image is the state #16 was filed about.
      - name: Report image publication
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "::notice::published ${{ steps.registry.outputs.host }}/${{ github.repository_owner }}/frost:${{ env.VERSION }}"
          else
            echo "::warning::image NOT published (login=${{ steps.login.outcome }}, push=${{ steps.push.outcome }}); the binaries and Release object are unaffected"
          fi
